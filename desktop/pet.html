<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  This CSP has to allow this page's own inline script and stylesheet. A bare
  `default-src 'none'` blocks both, and it does so silently: the window opens,
  no script runs, the sprites never get their src, and a transparent frameless
  window with nothing in it is indistinguishable from one that never opened.
-->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src file: data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>dsh-pet</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: transparent;
    overflow: hidden;
    /* The window is exactly the sprite size; nothing may add a scrollbar. */
    user-select: none;
    -webkit-user-select: none;
    cursor: grab;
    /* Crossfade length for THIS state, read by every layer. */
    --fade: 200ms;
  }
  body.dragging { cursor: grabbing; }

  /*
    How long each change takes. The value lives on the body rather than on the
    incoming layer, so both sides of a crossfade read the same number: setting it
    per layer would fade the new sprite in at one speed while the old one lingers
    at another, which reads as a double image rather than a transition.

    The lengths are not uniform on purpose. An alert and a reaction have to snap;
    falling asleep has to drift.
  */
  body[data-state="waiting"]     { --fade: 110ms; }
  body[data-state="joy"]         { --fade: 130ms; }
  body[data-state="held"]        { --fade: 120ms; }
  body[data-state="drop"]        { --fade: 150ms; }
  body[data-state="done"]        { --fade: 170ms; }
  body[data-state="thinking"]    { --fade: 240ms; }
  body[data-state="float"]       { --fade: 280ms; }
  body[data-state="idle"],
  body[data-state="idle-bubble"] { --fade: 400ms; }
  body[data-state="sleep"]       { --fade: 650ms; }

  #pet { position: relative; width: 100%; height: 100%; }

  /*
    Every layer is mounted at once and only their opacity changes. Swapping `src`
    would restart the GIF from frame one on each switch, so a thinking pet that
    gets hovered would visibly stutter, the tick would restart its fall, and the
    idle variants would never finish a loop.

    Specificity matters too: `#pet img` is (1,0,1) and would beat a plain `#idle`
    (1,0,0), leaving every layer transparent — an invisible pet that looks
    perfectly healthy in the DOM. The state selectors below are (1,1,0), so they
    win.
  */
  #pet .sprite {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: 0;
    transition: opacity var(--fade) ease;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  body[data-state="idle"] #pet #idle                 { opacity: 1; }
  body[data-state="idle-bubble"] #pet #idle-bubble   { opacity: 1; }
  body[data-state="joy"] #pet #joy                   { opacity: 1; }
  body[data-state="thinking"] #pet #thinking         { opacity: 1; }
  body[data-state="waiting"] #pet #waiting           { opacity: 1; }
  body[data-state="sleep"] #pet #sleep               { opacity: 1; }
  body[data-state="held"] #pet #held                 { opacity: 1; }
  body[data-state="drop"] #pet #drop                 { opacity: 1; }
  body[data-state="done"] #pet #done                 { opacity: 1; }
  body[data-state="float"] #pet #float               { opacity: 1; }

  /*
    Facing the way it is carried. Only the sprites are mirrored — the marks and
    the hint are interface, not part of the creature.
  */
  body.mirrored #pet .sprite { transform: scaleX(-1); }

  /*
    The waiting mark. One glyph per kind of blocked interaction, drawn at 1:1 and
    scaled up here with pixelated rendering, so it stays crisp without shipping
    three whole animations. It pulses, because a static mark was missable in the
    corner of the eye — which is the entire point of this state.
  */
  #pet .mark {
    position: absolute;
    left: 33%;
    top: 5%;
    width: 20%;
    height: auto;
    opacity: 0;
    pointer-events: none;
    -webkit-user-drag: none;
    image-rendering: pixelated;
    transform: translateY(0);
  }
  body[data-state="waiting"][data-mark="approval"] #pet #mark-approval,
  body[data-state="waiting"][data-mark="question"] #pet #mark-question,
  body[data-state="waiting"][data-mark="plan-review"] #pet #mark-plan-review {
    animation: nudge 1.1s ease-in-out infinite;
  }
  @keyframes nudge {
    0%, 100% { opacity: .8;  transform: translateY(0); }
    40%      { opacity: 1;   transform: translateY(-9%); }
  }

  #hint {
    position: absolute;
    inset: auto 0 6% 0;
    text-align: center;
    font: 10px/1.4 system-ui, sans-serif;
    color: #fff;
    text-shadow: 0 1px 3px #000, 0 0 6px #000;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }
  body.hinting #hint { opacity: .9; }
</style>
</head>
<body data-state="idle" data-mark="">
  <div id="pet">
    <img id="idle" class="sprite" alt="">
    <img id="idle-bubble" class="sprite" alt="">
    <img id="joy" class="sprite" alt="">
    <img id="thinking" class="sprite" alt="">
    <img id="waiting" class="sprite" alt="">
    <img id="sleep" class="sprite" alt="">
    <img id="held" class="sprite" alt="">
    <img id="drop" class="sprite" alt="">
    <img id="done" class="sprite" alt="">
    <img id="float" class="sprite" alt="">
    <img id="mark-approval" class="mark" alt="">
    <img id="mark-question" class="mark" alt="">
    <img id="mark-plan-review" class="mark" alt="">
    <div id="hint">клик — открыть чат · правый клик — стиль и выход</div>
  </div>

<script>
  const SPRITES = ['idle', 'idle-bubble', 'joy', 'thinking', 'waiting',
                   'sleep', 'held', 'drop', 'done', 'float']
  /** States the host half is allowed to ask for; everything else is local. */
  const HOST_STATES = ['idle', 'thinking', 'waiting', 'done']
  const MARKS = ['approval', 'question', 'plan-review']
  const params = new URLSearchParams(location.search)

  /** Where each layer's sprite came from, so it can be restarted later. */
  const SOURCES = {}

  for (const layer of SPRITES.concat(MARKS.map(kind => `mark-${kind}`))) {
    const img = document.getElementById(layer)
    const url = params.get(layer)
    SOURCES[layer] = url
    img.src = url
    // A sprite that fails to decode leaves an invisible window, so say so instead
    // of silently showing nothing.
    img.addEventListener('error', () => console.error('dsh-pet: cannot load ' + img.src))
  }

  /**
   * Restart a GIF from its first frame.
   *
   * Several animations are events rather than loops: the somersault has to begin
   * with its dip and lean-back, the landing has to begin on impact. Left to run
   * in the background, a layer is revealed at whatever frame it happens to be on,
   * so hovering could catch the whale mid-flip and upside down.
   *
   * Chromium caches by URL, so reassigning the same src does nothing. A fresh
   * frame is fetched through a throwaway Image and swapped in only once it has
   * decoded, so the layer never goes blank in the middle of a crossfade.
   */
  let revision = 0
  const restart = layer => {
    const img = document.getElementById(layer)
    const url = SOURCES[layer]
    if (img === null || typeof url !== 'string' || url === '') return
    const fresh = new Image()
    fresh.onload = () => { img.src = fresh.src }
    fresh.src = `${url}${url.includes('?') ? '&' : '?'}r=${++revision}`
  }

  /** How long the clock hands over from the one-shot transformation to levitation. */
  const MORPH_MS = Number(params.get('morphMs')) || 4150
  /** The cheer after a click, so a click is never silent. */
  const FLASH_MS = 1400
  /** The landing animation's own length. */
  const DROP_MS = 900
  /** Calm idle before the pet dozes off. */
  const SLEEP_AFTER_MS = 180000
  /** Plain bobbing between showings of the bubble variant. */
  const IDLE_DWELL_MS = 9000
  /** The bubble variant's own length, so it is never cut off mid-event. */
  const FOAM_MS = 2880

  let base = HOST_STATES.includes(params.get('state')) ? params.get('state') : 'idle'
  let mark = null
  let hovering = false
  let flashing = false
  let dragging = false
  let dropping = false
  let sleeping = false
  let morphing = false
  let mirrored = false
  let idleVariant = 'idle'
  let lastActive = Date.now()

  let flashTimer = null
  let dropTimer = null
  let morphTimer = null
  let idleTimer = null

  /**
   * What to draw right now.
   *
   * Ordered by how immediate each thing is: being held beats a landing, a landing
   * beats the pointer, the pointer beats whatever the plugin asked for, and the
   * plugin's own state beats the idle daydreaming.
   */
  const shown = () => {
    if (dragging) return 'held'
    if (dropping) return 'drop'
    if (hovering || flashing) return 'joy'
    if (base === 'done') return morphing ? 'done' : 'float'
    if (base === 'idle') return sleeping ? 'sleep' : idleVariant
    return base                       // thinking | waiting
  }

  /**
   * Layers that are events, not ambience, and so must start from frame one.
   *
   * `float` is here for a different reason: it takes over from the end of the
   * transformation, where the tick sits at the middle of its bob, and its own
   * first frame is that same middle. Restarting it lines the two up, so the
   * hand-over is invisible instead of stepping a few pixels.
   */
  const RESTART_ON_ENTER = new Set(['joy', 'held', 'drop', 'done', 'float'])
  let lastLayer = null

  const apply = () => {
    const layer = shown()
    if (layer !== lastLayer) {
      if (RESTART_ON_ENTER.has(layer)) restart(layer)
      lastLayer = layer
    }
    document.body.dataset.state = layer
    document.body.dataset.mark = (base === 'waiting' && mark !== null) ? mark : ''
    document.body.classList.toggle('mirrored', mirrored)
  }

  /** Anything the user does resets the doze countdown. */
  const touch = () => {
    lastActive = Date.now()
    if (sleeping) {
      sleeping = false
      apply()
    }
  }

  /**
   * Adopt a state from the plugin.
   *
   * The transformation is one-shot: the tick then stays put until the plugin
   * says otherwise, so `done.gif` must not loop. After its run the layer quietly
   * switches to the seamless levitation loop.
   */
  const applyState = (next, kind) => {
    base = next
    mark = next === 'waiting' ? kind : null
    touch()
    if (morphTimer !== null) {
      clearTimeout(morphTimer)
      morphTimer = null
    }
    morphing = next === 'done'
    if (morphing) {
      morphTimer = setTimeout(() => {
        morphTimer = null
        morphing = false
        apply()
      }, MORPH_MS)
    }
    apply()
  }

  /** What the page is showing right now, for the self-test. */
  window.__petShown = () => ({
    base, mark, hovering, flashing, dragging, dropping, sleeping, morphing, mirrored,
    idleVariant, layer: document.body.dataset.state,
  })

  /** Also used by the self-test, so the test exercises this exact path. */
  window.__petSetState = next => {
    if (!HOST_STATES.includes(next)) return
    applyState(next, null)
  }

  /**
   * Force the hover state, for the self-test only.
   *
   * The test cannot move the physical cursor away, so a pet that happens to sit
   * under it would legitimately show joy and the "at rest" check would fail for
   * the wrong reason.
   */
  window.__petSetHover = next => {
    hovering = next === true
    if (hovering) touch()
    apply()
  }

  /** Force extras the test would otherwise have to wait minutes for. */
  window.__petTest = {
    setSleeping: next => { sleeping = next === true; apply() },
    setIdleVariant: next => { idleVariant = next; apply() },
    setMirrored: next => { mirrored = next === true; apply() },
    setDropping: next => { dropping = next === true; apply() },
  }

  // The main process relays the plugin's state and gesture through this bridge.
  window.petWindow.onState(message => {
    const next = typeof message === 'string' ? message : message?.state
    const kind = typeof message === 'string' ? null : message?.mark
    if (!HOST_STATES.includes(next)) return
    applyState(next, MARKS.includes(kind) ? kind : null)
  })
  window.petWindow.onFlash(() => {
    flashing = true
    apply()
    if (flashTimer !== null) clearTimeout(flashTimer)
    flashTimer = setTimeout(() => {
      flashTimer = null
      flashing = false
      apply()
    }, FLASH_MS)
  })
  window.petWindow.onDropped(() => {
    dropping = true
    apply()
    if (dropTimer !== null) clearTimeout(dropTimer)
    dropTimer = setTimeout(() => {
      dropTimer = null
      dropping = false
      apply()
    }, DROP_MS)
  })
  window.petWindow.onFacing(facing => {
    // The base sprite looks left, so carrying it right mirrors it.
    mirrored = facing === 'right'
    apply()
  })

  /*
    A look change reloads every layer from the other set of sprites. The window
    keeps its size, its position and its state; only the images change. The
    current layer is then re-asserted, so the switch is immediate rather than
    waiting for the next state change.
  */
  window.petWindow.onLook(payload => {
    if (payload === null || typeof payload !== 'object') return
    const incoming = { ...payload.sprites, ...payload.marks }
    for (const [layer, url] of Object.entries(incoming)) {
      if (!(layer in SOURCES) || typeof url !== 'string' || url === '') continue
      SOURCES[layer] = url
      const img = document.getElementById(layer)
      if (img !== null) img.src = url
    }
    lastLayer = null
    apply()
  })
  apply()

  // Hover shows joy. `mouseenter` does not bubble, so it is backed up by
  // `mouseover`, which does: whichever the platform delivers, the pet reacts.
  const enter = () => {
    touch()
    if (hovering) return
    hovering = true
    apply()
  }
  const leave = () => {
    if (!hovering) return
    hovering = false
    apply()
  }
  addEventListener('mouseenter', enter)
  addEventListener('mouseover', enter)
  addEventListener('mouseleave', leave)
  addEventListener('mouseout', event => { if (event.relatedTarget === null) leave() })

  // Dragging: the page reports press and release only. The movement is produced
  // by the main process from the real cursor, because a window dragged out from
  // under the pointer stops receiving mousemove within a few pixels and would
  // freeze mid-drag with a half-finished move. The main process also decides
  // whether the press was a click, and opens the chat if it was.
  const beginDrag = () => {
    // Re-arm on EVERY press, even if the previous release never arrived.
    //
    // A mouseup can be delivered to another window: while the pet is being
    // dragged it sits exactly under the pointer, and the release can go to
    // whatever takes the foreground next. Guarding on `dragging` would then leave
    // the pet stuck mid-gesture, and since the plugin still remembered the origin
    // of the PREVIOUS press, the next honest click would measure as a huge drag
    // and open nothing. Pressing again always starts a fresh gesture.
    touch()
    dragging = true
    document.body.classList.add('dragging')
    window.petWindow.dragStart()
    apply()
  }
  const finishDrag = () => {
    if (!dragging) return
    dragging = false
    document.body.classList.remove('dragging')
    window.petWindow.dragEnd()
    apply()
  }
  addEventListener('mousedown', event => {
    if (event.button !== 0) return
    event.preventDefault()
    beginDrag()
  })
  addEventListener('mouseup', finishDrag)
  // Losing focus mid-drag (alt-tab, a system dialog) must not leave the pet
  // glued to the cursor.
  addEventListener('blur', finishDrag)

  // Right-click opens the style menu — which is also where Exit lives, so
  // nothing is lost by not closing the pet straight from the gesture.
  addEventListener('contextmenu', event => { event.preventDefault(); window.petWindow.menu() })
  let hinted = false
  addEventListener('mouseenter', () => {
    if (hinted) return
    hinted = true
    document.body.classList.add('hinting')
    setTimeout(() => document.body.classList.remove('hinting'), 4000)
  })

  addEventListener('keydown', event => { if (event.key === 'Escape') window.petWindow.close() })

  /*
    A plain idle loop, repeating identically forever, starts reading as a looping
    GIF rather than a creature. Every so often the pet plays the bubble variant
    once, in full, and then goes back to plain bobbing.
  */
  const scheduleIdle = () => {
    if (idleTimer !== null) clearTimeout(idleTimer)
    const calm = base === 'idle' && !hovering && !dragging && !dropping && !sleeping
    if (!calm) {
      idleTimer = setTimeout(scheduleIdle, 2000)
      return
    }
    if (idleVariant === 'idle-bubble') {
      idleVariant = 'idle'
      apply()
      idleTimer = setTimeout(scheduleIdle, IDLE_DWELL_MS)
    } else if (Math.random() < 0.5) {
      idleVariant = 'idle-bubble'
      apply()
      idleTimer = setTimeout(scheduleIdle, FOAM_MS)
    } else {
      idleTimer = setTimeout(scheduleIdle, IDLE_DWELL_MS)
    }
  }
  scheduleIdle()

  // Dozing: three quiet minutes and the whale nods off. Any activity wakes it.
  setInterval(() => {
    const calm = base === 'idle' && !hovering && !dragging && !dropping
    if (!calm || sleeping) return
    if (Date.now() - lastActive > SLEEP_AFTER_MS) {
      sleeping = true
      if (idleVariant !== 'idle') idleVariant = 'idle'
      apply()
    }
  }, 5000)
</script>
</body>
</html>
